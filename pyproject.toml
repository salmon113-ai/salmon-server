[tool.poetry]
name = "salmon-server"
version = "0.1.0"
description = ""
authors = ["salmon113-ai <salmon113.ai@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"

langchain = "^0.3.1"
langchain-openai = "^0.2.1"
langchain-ollama = "^0.2.2"
langchain-community = "^0.3.1"
python-dotenv = "^1.0.1"
openai = "^1.51.0"
pyyaml = "^6.0.2"
pdfplumber = "^0.11.4"
streamlit = "^1.39.0"

# use langfuse
# langsmith = "^0.1.131"

langchain-huggingface = "^0.1.0"
langfuse = "^2.57.2"
fastapi = "^0.115.6"
uvicorn = "^0.34.0"
pydantic = "^2.10.4"
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
pytest = "^8.3.4"
black = "^24.10.0"
isort = "^5.13.2"
flake8 = "^7.1.1"

torch = [
    { markers = "sys_platform == 'darwin'", url = "https://download.pytorch.org/whl/cpu/torch-2.5.1-cp312-none-macosx_11_0_arm64.whl" },
    { markers = "sys_platform == 'linux'", url = "https://download.pytorch.org/whl/cpu/torch-1.13.1%2Bcpu-cp39-cp39-linux_x86_64.whl" },
    { markers = "sys_platform == 'win32'", url = "https://download.pytorch.org/whl/cpu/torch-2.5.1%2Bcpu-cp312-cp312-win_amd64.whl" }
]
python-json-logger = "^3.2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
